<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Beata Sai Integrated School</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #b71c1c, #d32f2f);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            background: #fff;
            padding: 3rem;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
        }

        .login-container h1 {
            color: #b71c1c;
            text-align: center;
            margin-bottom: 0.5rem;
            font-size: 1.5rem;
        }

        .login-container p {
            text-align: center;
            color: #666;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #333;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #b71c1c;
        }

        .btn-login {
            width: 100%;
            padding: 0.8rem;
            background: #b71c1c;
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-login:hover {
            background: #d32f2f;
        }

        .error-msg {
            color: #b71c1c;
            text-align: center;
            margin-top: 1rem;
            display: none;
        }

        .dashboard {
            display: none;
            text-align: center;
        }

        .dashboard h2 {
            color: #b71c1c;
            margin-bottom: 1rem;
        }

        .dashboard p {
            color: #555;
            margin-bottom: 2rem;
        }

        .btn-logout {
            padding: 0.6rem 2rem;
            background: #b71c1c;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
        }

        .btn-logout:hover {
            background: #d32f2f;
        }
    </style>
</head>

<body>
    <div class="login-container" id="loginForm">
        <h1>Admin Portal</h1>
        <p>Beata Sai Integrated School</p>
        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn-login">Login</button>
        </form>
        <p class="error-msg" id="errorMsg">Invalid username or password</p>
    </div>

    <div class="login-container dashboard" id="dashboard">
        <h2>Welcome, <span id="adminName"></span></h2>
        <p>You are logged in as administrator.</p>
        <button class="btn-logout" onclick="handleLogout()">Logout</button>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');

            try {
                const res = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('adminName', data.admin.name);
                    showDashboard(data.admin.name);
                } else {
                    errorMsg.style.display = 'block';
                    errorMsg.textContent = data.message;
                }
            } catch (err) {
                errorMsg.style.display = 'block';
                errorMsg.textContent = 'Cannot connect to server';
            }
        }

        function showDashboard(name) {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            document.getElementById('adminName').textContent = name;
        }

        function handleLogout() {
            localStorage.removeItem('token');
            localStorage.removeItem('adminName');
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('dashboard').style.display = 'none';
        }

        // Check if already logged in
        const token = localStorage.getItem('token');
        const adminName = localStorage.getItem('adminName');
        if (token && adminName) {
            showDashboard(adminName);
        }
    </script>
</body>

</html>
