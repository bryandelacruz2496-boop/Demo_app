services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html
      - ./admin.html:/usr/share/nginx/html/admin.html
      - ./student-login.html:/usr/share/nginx/html/student-login.html
      - ./style.css:/usr/share/nginx/html/style.css
      - ./script.js:/usr/share/nginx/html/script.js
      - ./student-portal.css:/usr/share/nginx/html/student-portal.css
      - ./student-portal.js:/usr/share/nginx/html/student-portal.js
      - ./admin-portal.css:/usr/share/nginx/html/admin-portal.css
      - ./admin-portal.js:/usr/share/nginx/html/admin-portal.js

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/beatasai
      - JWT_SECRET=${JWT_SECRET:-change-this-in-production}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-change-this-encryption-key}
      - FILE_ENCRYPTION_KEY=${FILE_ENCRYPTION_KEY:-change-this-file-key}
      - ALLOWED_ORIGINS=http://localhost:8080
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=5000
    depends_on:
      - mongo
    volumes:
      - uploads_data:/app/uploads

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
  uploads_data:
